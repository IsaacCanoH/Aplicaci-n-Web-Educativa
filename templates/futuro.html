{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row align-items-center g-5">

        <div class="col-md-6 text-center text-md-start">
            <h2 class="fw-bold mb-3">
                El planeta que dejaremos a nuestros hijos
            </h2>
            <p class="lead text-muted">
                Las decisiones que tomamos hoy impactarán directamente
                la calidad de vida de las próximas generaciones.
            </p>
        </div>

        <div class="col-md-6 text-center">
            <img 
                src="{{ url_for('static', filename='img/futuro.png') }}"
                class="img-fluid rounded shadow-lg border border-2 border-success"
                alt="Futuro del planeta"
            >
        </div>

    </div>
</div>
{% endblock content %}
